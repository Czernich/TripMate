info:
  name: List trip with pagination
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/trips?limit=2&offset=0"
  params:
    - name: limit
      value: "2"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns an array within the requested limit", function () {
          const trips = res.getBody();

          expect(trips).to.be.an("array");
          expect(trips.length).to.be.at.most(2);
        });

        test("Each trip contains the required fields", function () {
          const trips = res.getBody();

          trips.forEach(function (trip) {
            expect(Number.isInteger(trip.id)).to.equal(true);
            expect(trip.name).to.be.a("string").and.not.be.empty;
            expect(trip.destination).to.be.a("string").and.not.be.empty;
            expect(trip.start_date).to.be.a("string");
            expect(trip.end_date).to.be.a("string");
          });
        });

        test("Trips are ordered by ID ascending", function () {
          const trips = res.getBody();

          for (let i = 1; i < trips.length; i++) {
            expect(trips[i].id).to.be.greaterThan(trips[i - 1].id);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
