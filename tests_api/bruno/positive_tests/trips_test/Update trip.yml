info:
  name: Update trip
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/trips/{{tripId}}"
  body:
    type: json
    data: |-
      {
        "destination": "Madrid",
        "start_date": "2026-11-10",
        "end_date": "2026-11-15"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
