info:
  name: Health check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Health return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Body status ok", function () {
          expect(res.getBody().status).to.equal("ok");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
