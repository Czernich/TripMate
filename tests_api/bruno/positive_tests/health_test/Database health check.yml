info:
  name: Database health check
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/health/db"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Health DB return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Connection with DB", function () {
          expect(res.getBody().status).to.equal("ok");
        });
  assertions:
    - expression: res.body.status
      operator: eq
      value: ok

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
