info:
  name: Get missing trip
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/trips/{{missingTripId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 404 for a non-existent trip", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Returns the TRIP_NOT_FOUND error code", function () {
          expect(res.getBody().error.code).to.equal("TRIP_NOT_FOUND");
        });

        test("Error message contains the requested trip ID", function () {
          const message = res.getBody().error.message;
          const missingTripId = bru.getEnvVar("missingTripId");

          expect(message).to.be.a("string");
          expect(message).to.include(String(missingTripId));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
